<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Queensland Flood Intelligence</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
  background:#020617;
}

.scrollbar::-webkit-scrollbar{
  width:8px;
}

.scrollbar::-webkit-scrollbar-thumb{
  background:#334155;
  border-radius:12px;
}
</style>

</head>

<body class="text-slate-100">

<div class="p-6">

  <h1 class="text-4xl font-bold">
    Queensland Flood Intelligence
  </h1>

  <p class="text-slate-400 mt-2 mb-6">
    Live Moderate & Major Flood Monitoring
  </p>

  <div class="grid md:grid-cols-4 gap-4 mb-6">

    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4">
      <div class="text-slate-400">
        Major
      </div>

      <div id="majorCount" class="text-3xl font-bold text-red-500">
        -
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4">
      <div class="text-slate-400">
        Moderate
      </div>

      <div id="moderateCount" class="text-3xl font-bold text-orange-400">
        -
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4">
      <div class="text-slate-400">
        Flooded Stations
      </div>

      <div id="stationCount" class="text-3xl font-bold text-cyan-400">
        -
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4">
      <div class="text-slate-400">
        Status
      </div>

      <div id="status" class="text-xl font-bold text-green-400">
        Loading
      </div>
    </div>

  </div>

  <div class="grid lg:grid-cols-3 gap-6">

    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4">

      <h2 class="text-xl font-semibold mb-4">
        Active Flood Catchments
      </h2>

      <div
        id="catchments"
        class="space-y-3 max-h-[750px] overflow-auto scrollbar"
      ></div>

    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4">

      <h2 class="text-xl font-semibold mb-4">
        Flood Details
      </h2>

      <div id="details">

        <div class="text-slate-400">
          Select a station
        </div>

      </div>

    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4">

      <h2 class="text-xl font-semibold mb-4">
        Catchment Summary
      </h2>

      <div
        id="summary"
        class="space-y-2 max-h-[750px] overflow-auto scrollbar"
      ></div>

    </div>

  </div>

</div>

<script>

const API =
  "https://qld-flood-api.onrender.com";

let catchmentData = [];
let summaryData = [];

async function loadData() {

  try {

    const [
      catchmentsResponse,
      summaryResponse
    ] = await Promise.all([
      fetch(`${API}/api/catchments`),
      fetch(`${API}/api/catchment-summary`)
    ]);

    catchmentData =
      await catchmentsResponse.json();

    summaryData =
      await summaryResponse.json();

    document.getElementById(
      "status"
    ).textContent = "Live";

    renderSummary();
    renderCatchments();

  } catch (err) {

    console.error(err);

    document.getElementById(
      "status"
    ).textContent = "Offline";

  }

}

function renderSummary() {

  let major = 0;
  let moderate = 0;
  let stations = 0;

  summaryData.forEach(c => {

    major += c.major;
    moderate += c.moderate;
    stations += c.stations;

  });

  document.getElementById(
    "majorCount"
  ).textContent = major;

  document.getElementById(
    "moderateCount"
  ).textContent = moderate;

  document.getElementById(
    "stationCount"
  ).textContent = stations;

  const container =
    document.getElementById(
      "summary"
    );

  container.innerHTML = "";

  summaryData.forEach(c => {

    container.innerHTML += `
      <div class="bg-slate-800 rounded-xl p-3">

        <div class="font-semibold">
          ${c.catchment}
        </div>

        <div class="text-sm text-slate-400">
          Stations: ${c.stations}
        </div>

        <div class="text-red-400">
          Major: ${c.major}
        </div>

        <div class="text-orange-400">
          Moderate: ${c.moderate}
        </div>

      </div>
    `;

  });

}

function renderCatchments() {

  const container =
    document.getElementById(
      "catchments"
    );

  container.innerHTML = "";

  catchmentData.forEach(c => {

    const details =
      document.createElement(
        "details"
      );

    details.className =
      "bg-slate-800 rounded-2xl";

    details.innerHTML = `

      <summary
        class="cursor-pointer font-semibold p-4"
      >
        ${c.catchment}
        (${c.stations.length})
      </summary>

      <div class="p-3 space-y-2">

        ${c.stations.map(s => `

          <button
            class="station w-full text-left bg-slate-700 hover:bg-slate-600 rounded-xl p-3"
            data-id="${s.id}"
          >

            <div class="font-semibold">
              ${s.name}
            </div>

            <div class="text-sm">
              ${s.level}m
            </div>

            <div class="${
              s.status === 'Major'
              ? 'text-red-400'
              : 'text-orange-400'
            }">
              ${s.status}
            </div>

          </button>

        `).join("")}

      </div>

    `;

    container.appendChild(
      details
    );

  });

  document
    .querySelectorAll(
      ".station"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const id =
            button.dataset.id;

          for (const catchment of catchmentData) {

            const station =
              catchment.stations.find(
                s => s.id === id
              );

            if (station) {
              showStation(
                station
              );
              return;
            }

          }

        }
      );

    });

}

function showStation(station) {

  document.getElementById(
    "details"
  ).innerHTML = `

    <div class="space-y-3">

      <div class="text-2xl font-bold">
        ${station.name}
      </div>

      <div>
        Status:
        <span class="${
          station.status === 'Major'
          ? 'text-red-500'
          : 'text-orange-400'
        } font-bold">
          ${station.status}
        </span>
      </div>

      <div>
        Current Level:
        <strong>
          ${station.level}m
        </strong>
      </div>

      <div>
        Observed:
        ${station.timestamp}
      </div>

      <div>
        Basin:
        ${station.basin}
      </div>

      <div>
        Stream:
        ${station.stream}
      </div>

      <hr class="border-slate-600">

      <div>
        Minor:
        ${station.thresholds?.minor ?? "-"}m
      </div>

      <div>
        Moderate:
        ${station.thresholds?.moderate ?? "-"}m
      </div>

      <div>
        Major:
        ${station.thresholds?.major ?? "-"}m
      </div>

      <hr class="border-slate-600">

      <a
        class="text-cyan-400 underline"
        target="_blank"
        href="${station.plt}"
      >
        Open BoM Hydrograph
      </a>

    </div>

  `;

}

loadData();

setInterval(
  loadData,
  300000
);

</script>

</body>
</html>
